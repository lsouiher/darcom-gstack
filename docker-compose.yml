# =============================================================================
# PRODUCTION Docker Compose Configuration
# Run with: docker compose up -d
# This file builds optimized production containers (no hot-reload, smaller images)
#
# REQUIRED: Create a .env file in this directory with:
#   MONGO_USER=your_username
#   MONGO_PASSWORD=your_strong_password
# =============================================================================

services:
  # ===========================================================================
  # MongoDB Database Container
  # ===========================================================================
  mongo:
    image: mongo:latest                              # Official MongoDB image
    command: mongod --quiet --logpath /dev/null      # Suppress verbose logging
    restart: unless-stopped                          # Auto-restart on failure/reboot
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}     # Set in .env file
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD} # Set in .env file
    ports:
      - 127.0.0.1:27018:27017                       # Bind to localhost only
    volumes:
      - mongodb_data:/data/db                        # Persist database data
      - mongodb_config:/data/configdb                # Persist MongoDB config

  # ===========================================================================
  # Mongo Express - Web-based MongoDB Admin UI
  # DISABLED in production. Access via SSH tunnel instead:
  #   ssh -L 8084:localhost:8084 root@YOUR_SERVER_IP
  # ===========================================================================
  # mongo-express:
  #   image: mongo-express:latest
  #   restart: unless-stopped
  #   ports:
  #     - 127.0.0.1:8084:8081
  #   environment:
  #     ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
  #     ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_USER}
  #     ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_PASSWORD}
  #   depends_on:
  #     - mongo

  # ===========================================================================
  # Backend API Server (Node.js/Express) - PRODUCTION BUILD
  # ===========================================================================
  dw-backend:
    build:
      context: .                                     # Build from project root
      dockerfile: ./backend/Dockerfile               # Production Dockerfile (optimized, no dev tools)
    env_file: ./backend/.env.docker                  # Load environment config
    restart: unless-stopped
    ports:
      - 4004:4004                                    # API endpoint
    depends_on:
      - mongo
    volumes:
      - cdn:/var/www/cdn/darywin                     # Shared CDN for uploaded files
      - backend_logs:/darywin/backend/logs           # Persist logs
      # NOTE: No source code mount - production uses built code inside container
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4004"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Admin Panel (React) - PRODUCTION BUILD
  # ===========================================================================
  dw-admin:
    build:
      context: .
      dockerfile: ./admin/Dockerfile                 # Production Dockerfile (nginx serving built static files)
    restart: unless-stopped
    depends_on:
      - dw-backend
    ports:
      - 3003:3003                                    # Admin panel URL
      # NOTE: No volume mounts - production serves pre-built static files

  # ===========================================================================
  # Frontend Customer App (React) - PRODUCTION BUILD
  # ===========================================================================
  dw-frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile              # Production Dockerfile (nginx serving built static files)
    restart: unless-stopped
    depends_on:
      - dw-backend
    ports:
      - 8081:80                                      # HTTP (nginx default port 80 mapped to 8081)
      - 8443:443                                     # HTTPS
    volumes:
      - cdn:/var/www/cdn/darywin                     # Access uploaded files for serving images

# =============================================================================
# Named Volumes - Data persists across container restarts
# =============================================================================
volumes:
  cdn:                                               # User uploads (images, documents)
  mongodb_data:                                      # Database files
  mongodb_config:                                    # MongoDB settings
  backend_logs:                                      # Server logs
